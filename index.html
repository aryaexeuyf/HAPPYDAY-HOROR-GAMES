<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HAPPY DAY Season 2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
</head>
<body>
    <div style="display:none;">
        <iframe id="main-bgsound-iframe" src="https://www.youtube.com/embed/lVBBIkA7tMI?loop=1&playlist=lVBBIkA7tMI&controls=0"></iframe>
        <iframe id="start-sound-iframe" src="https://www.youtube.com/embed/d40PeoOXE1E?controls=0"></iframe>
        <iframe id="alert-bgsound-iframe" src="https://www.youtube.com/embed/flKtFnB4OVs?loop=1&playlist=flKtFnB4OVs&controls=0"></iframe>
    </div>

    <div id="game-container">
        <div class="scanline-overlay"></div>
        <div id="flash-overlay"></div>

        <section id="start-screen" class="game-page active">
            <h1 class="glitch" data-text="HAPPYDAY">HAPPYDAY</h1>
            <h2 class="season-text flicker">Season 2</h2>
            <button id="start-game-btn" class="btn glitch-btn">START GAME</button>
        </section>

        <section id="level-selection-screen" class="game-page">
            <h2 class="retro-text flicker">Pilih Level</h2>
            <div class="level-buttons">
                <button id="level1-btn" class="btn level-btn">Level 1</button>
                <button class="btn level-btn locked" disabled>Level 2 <span class="lock-icon">🔒</span></button>
                <button class="btn level-btn locked" disabled>Level 3 <span class="lock-icon">🔒</span></button>
            </div>
            <p id="level-status" class="retro-text"></p>
            <button id="delete-progress-btn" class="trash-icon" title="Hapus Progres">🗑️</button>
        </section>

        <section id="narrative-screen" class="game-page">
            <div class="narrative-box">
                <p id="narrative-text" class="animated-text"></p>
                <button id="continue-btn" class="btn continue-btn" style="display:none;">Lanjut</button>
            </div>
        </section>

        <section id="user-input-screen" class="game-page">
            <h2 class="retro-text">Siapa Kalian?</h2>
            <div id="user-list"></div>
            <div class="input-group">
                <input type="text" id="manual-name-input" placeholder="Tambahkan Nama..." class="retro-input">
                <button id="add-name-btn" class="btn">+</button>
            </div>
            <button id="start-mission-btn" class="btn glitch-btn">Mulai Misi!</button>
        </section>

        <section id="mission-screen" class="game-page">
            <div id="mission-content" class="narrative-box">
                </div>
        </section>

        <section id="game-over-screen" class="game-page">
            <h2 class="glitch" data-text="MISI SELESAI!">MISI SELESAI!</h2>
            <p class="retro-text">Misi yang anda kerjakan sudah selesai, pastikan jangan membuka ulang game horor ini karena kami akan datang dan menghantui kalian di jam 20.00 setiap hari Sabtu, Minggu, Kamis, Jumat.</p>
        </section>

        <section id="alert-screen" class="game-page alert-mode">
            <div class="alert-content">
                <div class="alert-text-container">
                    <h2 class="glitch red-text" data-text="PERINGATAN">PERINGATAN</h2>
                    <p id="alert-narrative" class="animated-text-loop"></p>
                </div>
                <div class="video-container">
                    <div class="retro-tv-filter">
                        <iframe id="alert-video-player" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                        <div class="iframe-overlay"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
